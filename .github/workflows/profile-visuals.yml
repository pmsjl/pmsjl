name: Profile visuals

on:
  workflow_dispatch:
  schedule:
    # UTC 20:17 = Asia/Shanghai 04:17 (next day).
    - cron: '17 20 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/profile-visuals.yml'
      - 'tools/publish_generated.py'

permissions:
  contents: write

concurrency:
  group: profile-visuals
  cancel-in-progress: false

jobs:
  generate:
    if: github.repository == 'pmsjl/pmsjl'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - name: Generate contribution snake
        # Platane/snk v3, resolved 2026-09-07.
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b
        with:
          github_user_name: pmsjl
          github_token: ${{ secrets.GITHUB_TOKEN }}
          outputs: |
            .profile-build/snake-light.svg?color_snake=#8B5CF6&color_dots=#e2e8f0,#bfdbfe,#93c5fd,#3B82F6,#8B5CF6
            .profile-build/snake-dark.svg?palette=github-dark&color_snake=#38BDF8&color_dots=#1e293b,#312e81,#4338ca,#8B5CF6,#38BDF8

      - name: Generate contribution city
        # yoshi389111/github-profile-3d-contrib latest release branch, resolved 2026-09-07.
        uses: yoshi389111/github-profile-3d-contrib@7d95e7d4cdc028dd1e1cbd957d65f35efb12ae39
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: pmsjl

      - name: Validate all images before replacing previous output
        run: python tools/publish_generated.py

      - name: Commit generated assets only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- assets/generated/snake-light.svg assets/generated/snake-dark.svg assets/generated/city-light.svg assets/generated/city-dark.svg
          if git diff --cached --quiet; then
            echo "Generated images unchanged."
            exit 0
          fi
          git commit -m "chore: refresh profile contribution visuals"
          git push origin HEAD:main
